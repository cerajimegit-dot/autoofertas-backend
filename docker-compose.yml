version: '3.8'

services:
  db:
    image: postgres:14-alpine
    container_name: playas_autos_db
    environment:
      POSTGRES_DB: playas_autos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: playas_autos_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:

# Para ejecutar: docker-compose up -d
# Para detener: docker-compose down
# Para ver logs: docker-compose logs -f db
