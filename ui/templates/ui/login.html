<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Playas de Autos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 420px;
            padding: 45px;
        }
        .login-header {
            text-align: center;
            margin-bottom: 35px;
        }
        .login-header i {
            font-size: 48px;
            color: #667eea;
            margin-bottom: 15px;
            display: block;
        }
        .login-header h1 {
            color: #2c3e50;
            font-size: 28px;
            font-weight: 700;
            margin: 0;
        }
        .login-header p {
            color: #7f8c8d;
            font-size: 14px;
            margin: 5px 0 0 0;
        }
        .form-control {
            border-radius: 6px;
            border: 1.5px solid #ddd;
            padding: 12px 15px;
            font-size: 14px;
            transition: all 0.3s;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.15);
            background-color: #f8f9ff;
        }
        .form-control::placeholder {
            color: #bdc3c7;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-label {
            color: #2c3e50;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
            display: block;
        }
        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px 20px;
            font-weight: 700;
            margin-top: 10px;
            border-radius: 6px;
            font-size: 15px;
            letter-spacing: 0.5px;
            transition: all 0.3s;
        }
        .btn-login:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-login:active {
            transform: translateY(0);
        }
        .alert {
            border-radius: 6px;
            margin-bottom: 20px;
            border: none;
            font-size: 14px;
        }
        .alert-danger {
            background-color: #fee;
            color: #c33;
        }
        .alert-success {
            background-color: #efe;
            color: #3c3;
        }
        .demo-credentials {
            background-color: #f8f9ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 6px;
            margin-top: 25px;
            font-size: 12px;
            color: #555;
        }
        .demo-credentials strong {
            color: #2c3e50;
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
        }
        .demo-code {
            background-color: white;
            padding: 8px 10px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            margin: 5px 0;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <i class="fas fa-car"></i>
            <h1>Playas de Autos</h1>
            <p>Sistema de Gestión de Inventario</p>
        </div>

        {% if error %}
            <div class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="fas fa-exclamation-circle"></i> {{ error }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endif %}

        <form method="post" action="{% url 'ui:login' %}" novalidate>
            {% csrf_token %}
            
            <div class="form-group">
                <label for="username" class="form-label">
                    <i class="fas fa-user"></i> Usuario
                </label>
                <input type="text" 
                       class="form-control" 
                       id="username" 
                       name="username" 
                       placeholder="Ingrese su usuario"
                       value="{{ username|default:'' }}"
                       required 
                       autofocus
                       autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password" class="form-label">
                    <i class="fas fa-lock"></i> Contraseña
                </label>
                <input type="password" 
                       class="form-control" 
                       id="password" 
                       name="password" 
                       placeholder="Ingrese su contraseña"
                       required
                       autocomplete="current-password">
            </div>

            <div class="form-group form-check">
                <input type="checkbox" class="form-check-input" id="remember" name="remember">
                <label class="form-check-label" for="remember" style="font-size: 14px; color: #555;">
                    Recordarme en esta computadora
                </label>
            </div>

            <button type="submit" class="btn btn-login w-100">
                <i class="fas fa-sign-in-alt"></i> INGRESAR AL SISTEMA
            </button>
        </form>

        <div class="demo-credentials">
            <strong>🔑 Credenciales de Demostración:</strong>
            <div class="demo-code"><strong>Usuario:</strong> admin</div>
            <div class="demo-code"><strong>Contraseña:</strong> admin123</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Focus on first empty field
        document.addEventListener('DOMContentLoaded', function() {
            const username = document.getElementById('username');
            if (username.value === '') {
                username.focus();
            } else {
                document.getElementById('password').focus();
            }
        });
    </script>
</body>
</html>
